<!doctype html>
<html lang="fr-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Favicons & PWA -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%favicon.svg" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="theme-color" content="#1E0F21" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FAF4EB" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="light dark" />

    <!-- SEO -->
    <title>Maison Wanél — Concept e-commerce par Wanil Parfait</title>
    <meta name="description" content="Maison Wanél est un projet de portfolio React : catalogue de mode fictif, favoris, panier et parcours de démonstration sans paiement réel." />
    <meta name="author" content="Wanil Parfait" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Maison Wanél" />
    <meta property="og:locale" content="fr_CA" />
    <meta property="og:locale:alternate" content="en_CA" />
    <meta property="og:title" content="Maison Wanél — Concept e-commerce React" />
    <meta property="og:description" content="Projet de portfolio par Wanil Parfait. Catalogue, favoris et panier de démonstration." />
    <meta property="og:image" content="https://wanil123.github.io/maison-wanel/og-image.svg" />
    <meta property="og:image:alt" content="Maison Wanél — Projet e-commerce React" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Maison Wanél — Concept e-commerce React" />
    <meta name="twitter:description" content="Projet de portfolio par Wanil Parfait." />
    <meta name="twitter:image" content="https://wanil123.github.io/maison-wanel/og-image.svg" />

    <!-- Preconnect -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="preconnect" href="https://images.pexels.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fonts: preload as=style + onload swap to avoid render-blocking -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700&display=swap"
      />
    </noscript>

    <!-- This is a portfolio demo, not a real merchant. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "CreativeWork",
        "name": "Maison Wanél",
        "description": "Fictional React storefront built as a portfolio project.",
        "author": { "@type": "Person", "name": "Wanil Parfait" },
        "isAccessibleForFree": true
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding:2rem;text-align:center;font-family:sans-serif">
        Cette boutique nécessite JavaScript activé. Please enable JavaScript to use Maison Wanél.
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
